<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barra lateral Nodo O&M</title>
  <style>

    :root{
      --bg1:#050d1c;
      --bg2:#07152b;
      --panel:rgba(10,27,52,.72);
      --border:rgba(125,211,252,.13);
      --text:#f8fbff;
      --muted:#88a6c8;
      --cyan:#22d3ee;
      --blue:#3b82f6;
      --blue2:#2563eb;
      --glow:rgba(34,211,238,.28);
      --button:#16386f;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:transparent;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      color:var(--text);
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 0%,rgba(37,99,235,.18),transparent 30%),
        radial-gradient(circle at 95% 35%,rgba(34,211,238,.08),transparent 28%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
    }

    .sidebar{
      position:relative;
      isolation:isolate;
      width:100%;
      min-height:100vh;
      padding:19px 15px 20px;
      border-right:1px solid rgba(96,165,250,.16);
      background:linear-gradient(180deg,rgba(5,14,30,.97),rgba(5,17,36,.98));
      overflow-x:hidden;
      overflow-y:auto;
      scrollbar-width:thin;
      scrollbar-color:rgba(59,130,246,.45) transparent;
    }

    .sidebar::-webkit-scrollbar{width:5px}
    .sidebar::-webkit-scrollbar-track{background:transparent}
    .sidebar::-webkit-scrollbar-thumb{
      background:linear-gradient(var(--blue),var(--cyan));
      border-radius:10px;
    }

    .sidebar::before{
      content:"";
      position:absolute;
      z-index:-1;
      width:180px;height:180px;
      left:-85px;top:-55px;
      border-radius:50%;
      background:rgba(37,99,235,.16);
      filter:blur(55px);
      pointer-events:none;
    }

    .sidebar::after{
      content:"";
      position:absolute;
      z-index:-1;
      width:150px;height:150px;
      right:-100px;top:38%;
      border-radius:50%;
      background:rgba(34,211,238,.10);
      filter:blur(55px);
      pointer-events:none;
    }

    .brand{
      position:relative;
      display:inline-block;
      font-size:19px;
      font-weight:900;
      letter-spacing:.025em;
      margin:0 0 4px;
      background:linear-gradient(90deg,#fff,#bfdbfe 55%,#67e8f9);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:0 0 22px rgba(96,165,250,.12);
    }

    .brand::after{
      content:"";
      position:absolute;
      left:0;bottom:-6px;
      width:36px;height:2px;
      border-radius:999px;
      background:linear-gradient(90deg,var(--blue),var(--cyan));
      box-shadow:0 0 12px rgba(34,211,238,.65);
    }

    .subbrand{
      font-size:11px;
      color:var(--muted);
      margin:10px 0 23px;
      letter-spacing:.055em;
      text-transform:uppercase;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .nav a{
      position:relative;
      display:flex;
      align-items:center;
      min-height:43px;
      padding:10px 13px 10px 16px;
      border-radius:11px;
      color:#dcecff;
      text-decoration:none;
      border:1px solid transparent;
      font-size:13px;
      font-weight:650;
      letter-spacing:.01em;
      overflow:hidden;
      transform:translateZ(0);
      transition:
        transform .22s cubic-bezier(.2,.8,.2,1),
        color .22s ease,
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
    }

    .nav a::before{
      content:"";
      position:absolute;
      left:0;
      top:50%;
      width:3px;
      height:0;
      border-radius:0 6px 6px 0;
      background:linear-gradient(180deg,#60a5fa,var(--cyan));
      box-shadow:0 0 13px var(--cyan);
      transform:translateY(-50%);
      transition:height .22s ease;
    }

    .nav a::after{
      content:"";
      position:absolute;
      top:-40%;
      left:-75%;
      width:42%;
      height:180%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.11),transparent);
      transform:skewX(-22deg);
      transition:left .48s ease;
      pointer-events:none;
    }

    .nav a:hover{
      color:#fff;
      background:linear-gradient(90deg,rgba(37,99,235,.15),rgba(34,211,238,.055));
      border-color:rgba(96,165,250,.22);
      box-shadow:0 7px 22px rgba(0,0,0,.15),inset 0 0 18px rgba(59,130,246,.035);
      transform:translateX(4px);
    }

    .nav a:hover::before{height:50%}
    .nav a:hover::after{left:135%}

    .nav a.active{
      color:#fff;
      background:
        linear-gradient(90deg,rgba(37,99,235,.28),rgba(34,211,238,.09)),
        rgba(12,31,58,.72);
      border-color:rgba(96,165,250,.34);
      box-shadow:
        0 0 0 1px rgba(34,211,238,.025),
        0 8px 24px rgba(0,0,0,.22),
        inset 0 0 24px rgba(59,130,246,.08),
        0 0 18px rgba(34,211,238,.08);
      transform:translateX(3px);
    }

    .nav a.active::before{
      height:68%;
      animation:activePulse 2.2s ease-in-out infinite;
    }

    .nav a.active::after{
      left:135%;
      animation:activeScan 4.2s ease-in-out infinite;
    }

    @keyframes activePulse{
      0%,100%{opacity:.72;box-shadow:0 0 8px rgba(34,211,238,.55)}
      50%{opacity:1;box-shadow:0 0 18px rgba(34,211,238,.95)}
    }

    @keyframes activeScan{
      0%,68%{left:-75%;opacity:0}
      72%{opacity:.85}
      90%{left:135%;opacity:.45}
      100%{left:135%;opacity:0}
    }

    .session-box{
      position:relative;
      margin-top:23px;
      padding:13px;
      border:1px solid rgba(96,165,250,.16);
      border-radius:14px;
      background:linear-gradient(145deg,rgba(13,32,59,.72),rgba(7,22,43,.65));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 10px 24px rgba(0,0,0,.13);
      backdrop-filter:blur(8px);
    }

    .session-box small{
      display:block;
      color:var(--muted);
      margin-bottom:9px;
      word-break:break-all;
      line-height:1.4;
      font-size:11px;
    }

    #sidebarUserEmail{color:#dbeafe}

    .logout-btn{
      position:relative;
      width:100%;
      border:1px solid rgba(96,165,250,.22);
      border-radius:10px;
      padding:10px 14px;
      font-weight:750;
      cursor:pointer;
      background:linear-gradient(135deg,#17386d,#12315f);
      color:#fff;
      box-shadow:0 7px 18px rgba(0,0,0,.16);
      transition:transform .18s ease,filter .18s ease,border-color .18s ease,box-shadow .18s ease;
    }

    .logout-btn:hover{
      filter:brightness(1.12);
      transform:translateY(-1px);
      border-color:rgba(34,211,238,.42);
      box-shadow:0 8px 22px rgba(0,0,0,.20),0 0 13px rgba(34,211,238,.08);
    }

    @media(max-width:600px){
      .sidebar{padding:16px 13px}
      .nav a{min-height:44px;font-size:13px}
    }

    @media(prefers-reduced-motion:reduce){
      .nav a,.nav a::before,.nav a::after,.logout-btn{transition:none!important}
      .nav a.active::before,.nav a.active::after{animation:none!important}
    }

  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="brand">Nodo O&amp;M</div>
    <div class="subbrand">Control y seguimiento</div>

    <nav class="nav" id="menuNav">
      <a href="index.html" data-page="index.html">Inicio</a>
      <a href="dashboard.html" data-page="dashboard.html">Dashboard</a>
      <a href="fallas.html" data-page="fallas.html">Tickets / Fallas</a>
      <a href="mantenimientos.html" data-page="mantenimientos.html">Mantenimientos</a>
      <a href="preventivos.html" data-page="preventivos.html">Preventivos</a>
      <a href="instalaciones.html" data-page="instalaciones.html">Instalaciones</a>
      <a href="factibilidades.html" data-page="factibilidades.html">Factibilidades</a>
      <a href="traslados.html" data-page="traslados.html">Traslados</a>
      <a href="materiales.html" data-page="materiales.html">Materiales</a>
      <a href="liquidaciones.html" data-page="liquidaciones.html">Liquidaciones</a>
      <a href="gastos.html" data-page="gastos.html">Gastos</a>
      <a href="tareas.html" data-page="tareas.html">Tareas y Alertas</a>
      <a href="reportes.html" data-page="reportes.html">Reportes</a>
      <a href="supervision.html" data-page="supervision.html">Supervisión</a>

      <a href="https://cacg1022.github.io/LibertyOyM/visormapa.html"
         data-page="visormapa.html">Visor</a>

      <a href="https://cacg1022.github.io/LibertyOyM/seguimiento/nodo.html"
         data-page="nodo.html">Nodo</a>
    </nav>

    <div class="session-box">
      <small>
        Sesión<br>
        <span id="sidebarUserEmail">Sin iniciar</span>
      </small>
      <button class="logout-btn" type="button" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>

  <script>
    (function(){
      function getCurrentPage(){
        const params = new URLSearchParams(location.search);
        const fromParam = params.get('page');
        if(fromParam) return fromParam.toLowerCase();

        try{
          if(document.referrer){
            const ref = new URL(document.referrer);
            const file = ref.pathname.split('/').pop();
            if(file) return file.toLowerCase();
          }
        }catch(e){}

        const file = location.pathname.split('/').pop();
        return (file || '').toLowerCase();
      }

      function markActive(){
        const current = getCurrentPage();
        document.querySelectorAll('#menuNav a').forEach(a=>{
          const page = (a.dataset.page || '').toLowerCase();
          a.classList.toggle('active', !!page && current.includes(page));
        });
      }

      function loadUser(){
        const email =
          localStorage.getItem('user_email') ||
          localStorage.getItem('email') ||
          '';

        const el = document.getElementById('sidebarUserEmail');
        if(el) el.textContent = email || 'Sin iniciar';
      }

      function navigate(e){
        const a = e.currentTarget;
        const href = a.getAttribute('href');
        if(!href) return;

        // Si la barra se usa dentro de un iframe, navega la ventana principal.
        if(window.parent && window.parent !== window){
          e.preventDefault();
          window.parent.location.href = href;
        }
      }

      document.querySelectorAll('#menuNav a').forEach(a=>{
        a.addEventListener('click', navigate);
      });

      document.getElementById('logoutBtn').addEventListener('click', function(){
        localStorage.removeItem('user_email');
        localStorage.removeItem('email');

        if(window.parent && window.parent !== window){
          try{
            if(typeof window.parent.logout === 'function'){
              window.parent.logout();
              return;
            }
          }catch(e){}
          window.parent.location.href = 'index.html';
        }else{
          try{
            if(typeof logout === 'function'){
              logout();
              return;
            }
          }catch(e){}
          location.href = 'index.html';
        }
      });

      markActive();
      loadUser();

      window.addEventListener('storage', loadUser);
    })();
  </script>
</body>
</html>
